<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarem · Uniformes del Colegio La Florida</title>
    <meta name="description" content="Uniformes oficiales del Colegio La Florida: diario, deportes y paquetes completos. Elige prenda y talla desde tu celular y paga con tarjeta, OXXO o efectivo en tienda.">
    <link rel="canonical" href="https://zarem.mx/">
    <meta property="og:title" content="Zarem · Uniformes del Colegio La Florida">
    <meta property="og:description" content="Uniformes oficiales del Colegio La Florida: diario, deportes y paquetes completos. Elige prenda y talla desde tu celular y paga con tarjeta, OXXO o efectivo en tienda.">
    <meta property="og:url" content="https://zarem.mx/">
    <meta property="og:image" content="https://zarem.mx/img/fotos/patio-grupo.webp">
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#ffffff">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind.config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/tienda.jsx"></script>
    <script type="text/babel">
        // Home: full-screen photos with slow parallax (useParallax in layout.jsx), Zara-style. Header floats over the hero.
        const Hero = () => (
            <section className="parallax h-[100svh] min-h-[560px] bg-florida-marino" data-speed="0.25">
                <img src="/img/fotos/patio-grupo.webp" alt={`Alumnos del ${BRAND.school} con uniforme diario y deportivo en el patio`} fetchpriority="high" />
                <div className="absolute inset-0 bg-gradient-to-b from-black/35 via-transparent to-black/45" />
                <div className="absolute inset-x-0 bottom-0 max-w-[1600px] mx-auto px-4 md:px-10 pb-14 md:pb-20 text-white">
                    <p className="label mb-5">Ciclo escolar 2026 – 2027</p>
                    <h1 className="text-[13vw] md:text-[8.5vw] leading-[0.88] uppercase font-light tracking-[-0.04em]">Uniformes<br />La Florida</h1>
                    <div className="flex flex-wrap gap-2 mt-10">
                        <a href="/pages/tienda/" className="btn btn-light">Comprar ahora</a>
                        <a href="/pages/tienda/?linea=paquetes" className="btn btn-light">Paquetes completos</a>
                    </div>
                </div>
            </section>
        );

        // Two tall panels: girls / boys, each a parallax photo with a single label.
        const Split = () => (
            <section className="grid md:grid-cols-2 gap-1 mt-1">
                {[
                    { href: '/pages/tienda/?corte=nina', label: 'Niña', img: '/img/fotos/diario-nina.webp', alt: 'Uniforme diario de niña: cárdigan café, jumper gris y mallas blancas' },
                    { href: '/pages/tienda/?corte=nino', label: 'Niño', img: '/img/fotos/diario-nino.webp', alt: 'Uniforme diario de niño: polo blanca y pantalón café' },
                ].map(p => (
                    <a key={p.label} href={p.href} className="parallax group block h-[85vh] md:h-[110vh] bg-paper-50" data-speed="0.15">
                        <img src={p.img} alt={p.alt} loading="lazy" />
                        <span className="absolute left-4 md:left-10 bottom-8 md:bottom-12 text-5xl md:text-7xl font-light uppercase tracking-tight">{p.label}</span>
                        <span className="absolute right-4 md:right-10 bottom-10 md:bottom-14 label link">Ver todo</span>
                    </a>
                ))}
            </section>
        );

        const Featured = () => {
            const catalog = useCatalog();
            const items = catalog.products.filter(p => p.featured).slice(0, 4);
            return (
                <section className="max-w-[1600px] mx-auto px-4 md:px-10 pt-24 md:pt-32">
                    <div className="flex justify-between items-end mb-8">
                        <h2 className="text-4xl md:text-6xl uppercase">Esenciales</h2>
                        <a href="/pages/tienda/" className="label link">Ver todo</a>
                    </div>
                    {catalog.status === 'loading' && <GridSkeleton n={4} />}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-x-1">{items.map(p => <ProductCard key={p.id} product={p} catalog={catalog} />)}</div>
                </section>
            );
        };

        // Sports: wide band with both photos moving at different speeds.
        const Sports = () => (
            <section className="mt-24 md:mt-32">
                <div className="grid grid-cols-2 gap-1">
                    <a href="/pages/tienda/chamarra-deportiva-nina/" className="parallax block h-[70vh] md:h-[120vh] bg-paper-50" data-speed="0.1"><img src="/img/fotos/deportes-nina.webp" alt="Uniforme deportivo de niña, azul marino con franjas naranja y blanca" loading="lazy" /></a>
                    <a href="/pages/tienda/chamarra-deportiva-nino/" className="parallax block h-[70vh] md:h-[120vh] bg-paper-50 md:mt-40" data-speed="0.22"><img src="/img/fotos/deportes-nino.webp" alt="Uniforme deportivo de niño, azul marino con cuello naranja" loading="lazy" /></a>
                </div>
                <div className="max-w-[1600px] mx-auto px-4 md:px-10 mt-10 flex flex-col md:flex-row justify-between gap-6 md:items-end">
                    <h2 className="text-5xl md:text-8xl uppercase leading-[0.9]">Deportes</h2>
                    <div className="max-w-sm">
                        <p className="text-ink-700">Chamarra y pants azul marino con franjas naranja y blanca cosidas, no termofijadas: aguantan el lavado y el recreo.</p>
                        <a href="/pages/tienda/?linea=deportes" className="btn btn-line mt-6">Comprar deportes</a>
                    </div>
                </div>
            </section>
        );

        // Detail: the embroidered crest, close-up, with the text column scrolling past it.
        const Crest = () => (
            <section className="max-w-[1600px] mx-auto px-4 md:px-10 mt-24 md:mt-40 grid md:grid-cols-12 gap-8 items-center">
                <div className="md:col-span-7 parallax aspect-[4/5] bg-paper-50" data-speed="0.12">
                    <img src="/img/fotos/polo-escudo.webp" alt="Polo blanca con vivos y escudo del colegio bordado" loading="lazy" />
                </div>
                <div className="md:col-span-4 md:col-start-9 reveal">
                    <p className="label text-ink-500 mb-6">El detalle</p>
                    <h2 className="text-4xl md:text-6xl uppercase">El escudo, bordado.</h2>
                    <p className="text-ink-700 mt-6 leading-relaxed">Piqué de algodón peinado, cuello con vivos tejidos que no se enrosca y el escudo bordado punto por punto. Puedes añadir el nombre del alumno al comprar.</p>
                    <a href="/pages/tienda/polo-escudo/" className="btn btn-ink mt-8">Polo con escudo</a>
                </div>
            </section>
        );

        const STEPS = [
            ['01', 'Elige', 'Prenda o paquete, y la talla de tu hijo o hija.'],
            ['02', 'Paga', 'Con tarjeta, en OXXO o en efectivo al recoger.'],
            ['03', 'Recibe', 'Recoge en tienda en 48 h hábiles o recíbelo en casa.'],
        ];

        const NoLines = () => (
            <section className="parallax mt-24 md:mt-40 h-[100svh] min-h-[600px] bg-florida-marino" data-speed="0.2">
                <img src="/img/fotos/patio-abrazo.webp" alt={`Alumnos del ${BRAND.school} abrazados en el patio`} loading="lazy" />
                <div className="absolute inset-0 bg-black/35" />
                <div className="absolute inset-0 max-w-[1600px] mx-auto px-4 md:px-10 flex flex-col justify-end pb-14 md:pb-20 text-white">
                    <h2 className="text-5xl md:text-8xl uppercase leading-[0.9] max-w-4xl">Sin filas.</h2>
                    <ol className="grid md:grid-cols-3 gap-6 md:gap-10 mt-10 max-w-5xl">
                        {STEPS.map(([n, t, d]) => <li key={n} className="border-t border-white/60 pt-4"><p className="label">{n} · {t}</p><p className="text-sm text-white/85 mt-2">{d}</p></li>)}
                    </ol>
                    <a href="/pages/como-comprar/" className="btn btn-light self-start mt-10">Cómo comprar</a>
                </div>
            </section>
        );

        renderPage(() => <><Hero /><Split /><Featured /><Sports /><Crest /><NoLines /></>, { overlay: true });
    </script>
</body>
</html>
