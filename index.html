<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarem · Casa de confección</title>
    <meta name="description" content="Zarem, casa de confección de uniformes escolares. Elige tu colegio: Colegio La Florida o CUM.">
    <link rel="canonical" href="https://zarem.mx/">
    <meta property="og:title" content="Zarem · Casa de confección">
    <meta property="og:description" content="Zarem, casa de confección de uniformes escolares. Elige tu colegio: Colegio La Florida o CUM.">
    <meta property="og:url" content="https://zarem.mx/">
    <meta property="og:image" content="https://zarem.mx/img/portada/florida-edificio.webp">
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#ffffff">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind.config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel">
        // zarem.mx/: one screen, no scroll. One card per school (CLIENTS in layout.jsx); each opens that school's store,
        // where the logo, menu and bag switch to that school. Header floats over the photos.
        document.documentElement.style.overflow = 'hidden';

        const SchoolCard = ({ client, eager }) => (
            <a href={`${client.base}/`} className="group relative block h-full overflow-hidden bg-florida-marino text-white">
                {client.cover
                    ? <img src={client.cover} alt={`Instalaciones del ${client.name}`} className="absolute inset-0 w-full h-full object-cover transition-transform duration-[1.2s] ease-out group-hover:scale-[1.04]" fetchpriority={eager ? 'high' : undefined} />
                    : <div className="absolute inset-0 bg-ink" />}
                <div className="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-black/55" />
                <div className="absolute inset-x-0 bottom-0 px-4 md:px-10 pb-10 md:pb-16">
                    <p className="label mb-3 md:mb-5 text-white/85">Uniformes oficiales</p>
                    <h2 className="text-2xl sm:text-4xl md:text-6xl xl:text-7xl uppercase font-light tracking-[-0.03em] leading-[0.95]">{client.name}</h2>
                    <span className="label link inline-block mt-5 md:mt-8">{client.soon ? 'Ver más' : 'Entrar a la tienda'}</span>
                </div>
            </a>
        );

        const Home = () => (
            <section className="h-[100svh] grid grid-cols-2 gap-1">
                <h1 className="sr-only">Zarem · Casa de confección de uniformes escolares</h1>
                {CLIENTS.map((c, i) => <SchoolCard key={c.id} client={c} eager={i === 0} />)}
            </section>
        );

        renderPage(Home, { overlay: true, landing: true });
    </script>
</body>
</html>
