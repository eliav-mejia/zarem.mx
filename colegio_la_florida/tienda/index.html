<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda · Uniformes Colegio La Florida · Zarem</title>
    <meta name="description" content="Todas las prendas del uniforme del Colegio La Florida: polo con escudo, suéteres, pantalón, jumper, deportes y kinder, por talla.">
    <link rel="canonical" href="https://zarem.mx/colegio_la_florida/tienda/">
    <meta property="og:title" content="Tienda · Uniformes Colegio La Florida · Zarem">
    <meta property="og:description" content="Todas las prendas del uniforme del Colegio La Florida: polo con escudo, suéteres, pantalón, jumper, deportes y kinder, por talla.">
    <meta property="og:url" content="https://zarem.mx/colegio_la_florida/tienda/">
    <meta property="og:image" content="https://zarem.mx/img/fotos/patio-grupo.webp">
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#ffffff">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind.config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/tienda.jsx"></script>
    <script type="text/babel">
        const ShopPage = () => {
            const catalog = useCatalog();
            const params = new URLSearchParams(window.location.search);
            const [line, setLine] = useState(params.get('linea') || 'all');
            const [fit, setFit] = useState(params.get('corte') || 'all');
            const [type, setType] = useState(params.get('tipo') || 'all');
            const [cols, setCols] = useState(4);

            // Keep filters in the URL so a filtered view can be shared.
            useEffect(() => {
                const url = new URL(window.location);
                [['linea', line], ['corte', fit], ['tipo', type]].forEach(([k, v]) => (v === 'all' ? url.searchParams.delete(k) : url.searchParams.set(k, v)));
                history.replaceState(null, '', url);
            }, [line, fit, type]);

            const order = Object.fromEntries(catalog.types.map(t => [t.id, t.sort_order]));
            const inView = catalog.products
                .filter(p => line === 'all' || p.line_id === line)
                .filter(p => fit === 'all' || p.fit === fit || p.fit === 'unisex');
            // Subcategories: only the garment types present in the current line / fit.
            const types = catalog.types.filter(t => inView.some(p => p.type_id === t.id));
            // A subcategory that no longer exists in the new line / fit falls back to all of them.
            useEffect(() => { if (catalog.status === 'ready' && type !== 'all' && !types.some(t => t.id === type)) setType('all'); }, [catalog.status, line, fit]);
            const products = inView
                .filter(p => type === 'all' || p.type_id === type)
                .sort((a, b) => order[a.type_id] - order[b.type_id] || a.price_mxn - b.price_mxn);
            const title = [fit !== 'all' && FIT_LABEL[fit], line !== 'all' && catalog.line[line]?.label, type !== 'all' && catalog.type[type]?.label].filter(Boolean).join(' · ') || 'Todo';
            const tab = (active) => `label link ${active ? 'text-ink' : 'text-ink-400 hover:text-ink'}`;

            return (
                <>
                    <section className="max-w-[1600px] mx-auto px-4 md:px-10 pt-14 md:pt-20 pb-8">
                        <h1 className="text-5xl md:text-7xl uppercase">{title}</h1>
                        <div className="flex flex-col md:flex-row md:justify-between gap-4 mt-10">
                            <div className="flex flex-wrap gap-x-6 gap-y-3">
                                <div className="flex gap-5" role="group" aria-label="Para">
                                    {[['all', 'Todo'], ['nina', 'Niña'], ['nino', 'Niño']].map(([v, l]) => <button key={v} className={tab(fit === v)} aria-current={fit === v ? 'page' : undefined} onClick={() => setFit(v)}>{l}</button>)}
                                </div>
                                <span className="text-ink-300">|</span>
                                <div className="flex gap-5" role="group" aria-label="Línea">
                                    <button className={tab(line === 'all')} aria-current={line === 'all' ? 'page' : undefined} onClick={() => setLine('all')}>Todas</button>
                                    {catalog.lines.map(l => <button key={l.id} className={tab(line === l.id)} aria-current={line === l.id ? 'page' : undefined} onClick={() => setLine(l.id)}>{l.label}</button>)}
                                </div>
                                {types.length > 1 && (
                                    <div className="basis-full flex flex-wrap gap-x-5 gap-y-3" role="group" aria-label="Subcategoría">
                                        <button className={tab(type === 'all')} aria-current={type === 'all' ? 'page' : undefined} onClick={() => setType('all')}>Todas las prendas</button>
                                        {types.map(t => <button key={t.id} className={tab(type === t.id)} aria-current={type === t.id ? 'page' : undefined} onClick={() => setType(t.id)}>{t.label}</button>)}
                                    </div>
                                )}
                            </div>
                            <div className="hidden md:flex gap-4 items-center label text-ink-400" role="group" aria-label="Vista">
                                {catalog.status === 'ready' && <span>{products.length} artículos</span>}
                                {[2, 4].map(n => <button key={n} className={tab(cols === n)} onClick={() => setCols(n)} aria-pressed={cols === n}>{n === 2 ? 'Grande' : 'Pequeña'}</button>)}
                            </div>
                        </div>
                    </section>
                    <section className="max-w-[1600px] mx-auto md:px-10">
                        {catalog.status === 'loading' && <GridSkeleton />}
                        {catalog.status === 'error' && <LoadError />}
                        {catalog.status === 'ready' && products.length === 0 && <p className="label text-ink-500 text-center py-24">No hay prendas con estos filtros.</p>}
                        <div className={`grid grid-cols-2 gap-x-1 ${cols === 4 ? 'md:grid-cols-3 xl:grid-cols-4' : 'md:grid-cols-2'}`}>
                            {products.map(p => <ProductCard key={p.id} product={p} catalog={catalog} />)}
                        </div>
                    </section>
                </>
            );
        };

        renderPage(ShopPage);
    </script>
</body>
</html>
