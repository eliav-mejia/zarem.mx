<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda y contacto · Zarem</title>
    <meta name="description" content="Tienda de uniformes del Colegio La Florida: dirección, horario, WhatsApp y email.">
    <link rel="canonical" href="https://zarem.mx/colegio_la_florida/contacto/">
    <meta property="og:title" content="Tienda y contacto · Zarem">
    <meta property="og:description" content="Tienda de uniformes del Colegio La Florida: dirección, horario, WhatsApp y email.">
    <meta property="og:url" content="https://zarem.mx/colegio_la_florida/contacto/">
    <meta property="og:image" content="https://zarem.mx/img/fotos/patio-grupo.webp">
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#ffffff">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind.config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel">
        const ContactPage = () => {
            const [form, setForm] = useState({ name: '', email: '', message: '', consent: false });
            const [sent, setSent] = useState(false);
            const f = (key) => ({ value: form[key], onChange: (e) => setForm({ ...form, [key]: e.target.value }) });
            const submit = (e) => {
                e.preventDefault();
                window.open(waLink(`Hola Zarem, soy ${form.name} (${form.email}).\n\n${form.message}`), '_blank', 'noopener,noreferrer');
                setSent(true);
            };
            return (
                <>
                    <PageHero kicker="Contacto" title="Tienda y contacto" />
                    <section className="max-w-[1600px] mx-auto px-4 md:px-10 grid md:grid-cols-12 gap-12 py-10">
                        <div className="md:col-span-4 space-y-8">
                            <div className="border-t border-ink pt-4"><p className="label-strong mb-2">Tienda</p><p className="text-sm text-ink-700">{BRAND.store}</p><p className="text-sm text-ink-700">{BRAND.hours}</p>
                                <a className="label link mt-3 inline-block" href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(BRAND.store)}`} target="_blank" rel="noopener noreferrer">Ver en el mapa</a></div>
                            <div className="border-t border-ink pt-4"><p className="label-strong mb-2">Escríbenos</p><p className="text-sm text-ink-700">{BRAND.email}</p><p className="text-sm text-ink-700">{BRAND.phone}</p>
                                <a className="btn btn-ink mt-5" href={waLink('Hola Zarem, tengo una pregunta.')} target="_blank" rel="noopener noreferrer">WhatsApp</a></div>
                        </div>
                        <div className="md:col-span-6 md:col-start-7">
                            {sent ? <p className="text-2xl font-light">Gracias. Abrimos WhatsApp con tu mensaje.</p> : (
                                <form onSubmit={submit} className="grid gap-6">
                                    <input className="field" placeholder="Nombre" required autoComplete="name" {...f('name')} />
                                    <input className="field" type="email" placeholder="Email" required autoComplete="email" {...f('email')} />
                                    <textarea className="field" rows="5" required maxLength={1000} placeholder="Mensaje" {...f('message')} />
                                    <label className="flex gap-3 text-xs text-ink-700"><input type="checkbox" required checked={form.consent} onChange={e => setForm({ ...form, consent: e.target.checked })} className="accent-black" /> <span>Acepto el <a href="/colegio_la_florida/privacidad/" className="underline">aviso de privacidad</a>.</span></label>
                                    <button className="btn btn-ink self-start">Enviar</button>
                                </form>
                            )}
                        </div>
                    </section>
                </>
            );
        };

        renderPage(ContactPage);
    </script>
</body>
</html>
