    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root">
        <noscript>
            <h1>Cómo comprar los uniformes del Colegio La Florida</h1>
            <p>Cómo pedir los uniformes del Colegio La Florida: entrega en tienda o a domicilio, pago con tarjeta, OXXO o efectivo, guía de tallas y cambios.</p>
            <nav aria-label="Principal">
                <ul>
                    <li><a href="/colegio_la_florida/tienda/">Tienda de uniformes</a></li>
                    <li><a href="/colegio_la_florida/como-comprar/">Cómo comprar</a></li>
                    <li><a href="/colegio_la_florida/contacto/">Tienda y contacto</a></li>
                </ul>
            </nav>
        </noscript>
    </div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/tienda.jsx"></script>
    <script type="text/babel">
        // Sizes in cm, child's body measurements. [verificar con el taller]
        const SIZES = {
            head: ['Talla', 'Edad aprox.', 'Estatura', 'Pecho', 'Cintura'],
            rows: [['4', '4 años', '98 – 104', '56', '53'], ['6', '6 años', '110 – 116', '60', '55'], ['8', '8 años', '122 – 128', '64', '57'], ['10', '10 años', '134 – 140', '68', '60'],
                ['12', '12 años', '146 – 152', '74', '63'], ['14', '14 años', '158 – 164', '80', '66'], ['16', '16 años', '164 – 170', '86', '70'],
                ['CH', 'Juvenil', '166 – 172', '90', '74'], ['M', 'Juvenil', '172 – 178', '96', '80'], ['G', 'Juvenil', '176 – 182', '102', '86']],
        };

        const HowPage = () => {
            const catalog = useCatalog();
            const rules = catalog.rules;
            return (
                <>
                    <PageHero kicker="Ayuda" title="Cómo comprar" intro="Elige prenda y talla desde tu celular, paga como prefieras y recoge en tienda o recíbelo en casa. Sin filas." />
                    <div className="max-w-[1600px] mx-auto px-4 md:px-10 grid md:grid-cols-4 gap-12 py-10">
                        <nav className="hidden md:block sticky top-28 self-start" aria-label="Índice">
                            <ul className="flex flex-col gap-3">
                                {[['pasos', 'Pasos'], ['entrega', 'Entrega'], ['pagos', 'Formas de pago'], ['tallas', 'Guía de tallas'], ['bordado', 'Bordado de nombre'], ['cambios', 'Cambios']].map(([id, t]) => <li key={id} className="flex"><a href={`#${id}`} className="label link text-ink-500 hover:text-ink">{t}</a></li>)}
                            </ul>
                        </nav>
                        <div className="md:col-span-3 min-w-0 max-w-3xl space-y-16">
                            <section id="pasos" className="scroll-mt-28">
                                <h2 className="label-strong border-t border-ink pt-4 mb-6">Pasos</h2>
                                <ol className="grid sm:grid-cols-3 gap-8">
                                    {[['01', 'Elige', 'Las prendas que necesitas, con la talla del alumno; el precio depende de la talla.'], ['02', 'Confirma', 'Elige entrega y pago; tu pedido nos llega por WhatsApp.'], ['03', 'Paga y recibe', 'Te mandamos la liga de pago o la ficha de OXXO; preparamos tu pedido.']].map(([n, t, d]) => (
                                        <li key={n}><p className="text-4xl font-light">{n}</p><p className="label-strong mt-3">{t}</p><p className="text-sm text-ink-700 mt-1">{d}</p></li>
                                    ))}
                                </ol>
                            </section>
                            <section id="entrega" className="scroll-mt-28">
                                <h2 className="label-strong border-t border-ink pt-4 mb-6">Entrega</h2>
                                {rules && rules.shipping.map(s => <div key={s.id} className="border-t border-line py-4 grid sm:grid-cols-3 gap-2"><p className="label">{s.label}</p><p className="sm:col-span-2 text-sm text-ink-700">{s.detail} {s.cost_mxn ? `Costo ${formatMXN(s.cost_mxn)}; gratis desde ${formatMXN(s.free_from_mxn)}.` : 'Sin costo.'}</p></div>)}
                                <p className="text-sm text-ink-700 mt-4">Tienda: {BRAND.store} · {BRAND.hours}</p>
                            </section>
                            <section id="pagos" className="scroll-mt-28">
                                <h2 className="label-strong border-t border-ink pt-4 mb-6">Formas de pago</h2>
                                {rules && rules.payments.map(p => <div key={p.id} className="border-t border-line py-4 grid sm:grid-cols-3 gap-2"><p className="label">{p.label}</p><p className="sm:col-span-2 text-sm text-ink-700">{p.detail}</p></div>)}
                                <p className="text-sm text-ink-700 mt-4">Con OXXO, el pedido sale de 3 a 5 días hábiles después de que se confirma el pago.</p>
                            </section>
                            <section id="tallas" className="scroll-mt-28">
                                <h2 className="label-strong border-t border-ink pt-4 mb-6">Guía de tallas · cm</h2>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm min-w-[30rem]">
                                        <thead><tr>{SIZES.head.map(h => <th key={h} className="label text-left font-normal text-ink-500 py-2 border-b border-ink">{h}</th>)}</tr></thead>
                                        <tbody>{SIZES.rows.map(r => <tr key={r[0]} className="border-b border-line">{r.map((c, i) => <td key={i} className={`py-2.5 ${i === 0 ? 'font-medium' : 'text-ink-700'}`}>{c}</td>)}</tr>)}</tbody>
                                    </table>
                                </div>
                                <p className="text-sm text-ink-700 mt-4">Mide sobre ropa ligera. Si está entre dos tallas, elige la mayor: pantalones y jumpers traen 5 cm de dobladillo para alargar. Mallas por edad: 4-6, 7-9, 10-12 y 13-16.</p>
                            </section>
                            <section id="bordado" className="scroll-mt-28">
                                <h2 className="label-strong border-t border-ink pt-4 mb-6">Bordado de nombre</h2>
                                <p className="text-sm text-ink-700">Para que ninguna prenda se pierda, bordamos el nombre del alumno por {rules ? formatMXN(rules.embroidery_mxn) : ''} por prenda (máximo 24 caracteres). Agrega 2 días hábiles. Las prendas bordadas no tienen cambio.</p>
                            </section>
                            <section id="cambios" className="scroll-mt-28">
                                <h2 className="label-strong border-t border-ink pt-4 mb-6">Cambios</h2>
                                <p className="text-sm text-ink-700">Cambio de talla sin costo en tienda dentro de los 30 días naturales siguientes, con la prenda sin uso, sin lavar y con etiqueta. <a href="/colegio_la_florida/terminos/#cambios" className="underline">Términos completos</a></p>
                            </section>
                        </div>
                    </div>
                </>
            );
        };

        renderPage(HowPage);
    </script>
</body>
</html>
