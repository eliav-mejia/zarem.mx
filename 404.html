<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada · Zarem</title>
    <meta name="description" content="Esta página no existe o cambió de dirección. Vuelve a Zarem para elegir tu colegio y ver sus uniformes.">
    <meta name="robots" content="noindex">
    <meta property="og:title" content="Página no encontrada · Zarem">
    <meta property="og:description" content="Esta página no existe o cambió de dirección.">
    <meta property="og:image" content="https://zarem.mx/img/portada/patio-grupo.webp">
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#ffffff">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind.config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel">
        // Old URL → new URL. Add one entry per moved or deleted page (e.g. a product removed from the catalogue).
        // The previous one-page site used #anchors on "/", which keep working.
        // 1.2.0: the Florida store moved from /pages/* (and /public/db) to /colegio_la_florida/*.
        // Product pages removed when the catalogue was rebuilt from Odoo (2026-10-10) → closest new page.
        const MOVED = {
            '/colegio_la_florida/tienda/blusa-cuello-redondo/': '/colegio_la_florida/tienda/polo-diario-nina/',
            '/colegio_la_florida/tienda/cardigan-trenzado/': '/colegio_la_florida/tienda/sueter-abierto-nina/',
            '/colegio_la_florida/tienda/chamarra-deportiva-nina/': '/colegio_la_florida/tienda/chamarra-deportes/',
            '/colegio_la_florida/tienda/chamarra-deportiva-nino/': '/colegio_la_florida/tienda/chamarra-deportes/',
            '/colegio_la_florida/tienda/jumper-tablones/': '/colegio_la_florida/tienda/jumper-nina/',
            '/colegio_la_florida/tienda/mallas-caladas/': '/colegio_la_florida/tienda/calcetas-nina/',
            '/colegio_la_florida/tienda/pantalon-cafe/': '/colegio_la_florida/tienda/pantalon-diario-nino/',
            '/colegio_la_florida/tienda/pants-deportivo-nina/': '/colegio_la_florida/tienda/pants-deportes/',
            '/colegio_la_florida/tienda/pants-deportivo-nino/': '/colegio_la_florida/tienda/pants-deportes/',
            '/colegio_la_florida/tienda/paquete-deportes-nina/': '/colegio_la_florida/tienda/?linea=deportes&corte=nina',
            '/colegio_la_florida/tienda/paquete-deportes-nino/': '/colegio_la_florida/tienda/?linea=deportes&corte=nino',
            '/colegio_la_florida/tienda/paquete-diario-nina/': '/colegio_la_florida/tienda/?linea=diario&corte=nina',
            '/colegio_la_florida/tienda/paquete-diario-nino/': '/colegio_la_florida/tienda/?linea=diario&corte=nino',
            '/colegio_la_florida/tienda/polo-escudo/': '/colegio_la_florida/tienda/polo-diario-nino/',
            '/colegio_la_florida/tienda/sueter-cuello-v/': '/colegio_la_florida/tienda/sueter-cerrado-nino/',
        };
        const target = MOVED[location.pathname]
            || (location.pathname.startsWith('/pages/') ? location.pathname.replace(/^\/pages\//, '/colegio_la_florida/') : null);
        if (target) location.replace(target + location.search + location.hash);

        renderPage(() => (
            <PageHero kicker="404" title="Esta página no existe." intro="Puede que el enlace haya cambiado o que la prenda ya no esté disponible.">
                <div className="flex flex-wrap gap-2 mt-10">
                    <a href="/" className="btn btn-ink">Elegir colegio</a>
                    <a href="/colegio_la_florida/tienda/" className="btn btn-line">Tienda Colegio La Florida</a>
                </div>
            </PageHero>
        ));
    </script>
</body>
</html>
