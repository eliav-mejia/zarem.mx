<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniformes para empresas · Zarem</title>
    <meta name="description" content="Programa de uniformes para empresas en CDMX y todo México: diseño con tu imagen, medición en sitio, bordado de logotipo y entregas por colaborador.">
    <link rel="canonical" href="https://zarem.mx/pages/empresas/">
    <meta property="og:title" content="Uniformes para empresas · Zarem">
    <meta property="og:description" content="Programa de uniformes para empresas en CDMX y todo México: diseño con tu imagen, medición en sitio, bordado de logotipo y entregas por colaborador.">
    <meta property="og:url" content="https://zarem.mx/pages/empresas/">
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0b1b34">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind.config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/tienda.jsx"></script>
    <script type="text/babel">
        // Etapa 1: the request is saved in this browser and sent by WhatsApp (and to LEAD_ENDPOINT when configured).
        // Etapa 2: company accounts with staff, sizes and repeat orders in Supabase.
        const STEPS = [
            { n: '01', title: 'Diagnóstico', text: 'Conocemos a tu equipo, sus funciones y tu imagen de marca. Te llevamos muestrario de telas y colores.' },
            { n: '02', title: 'Propuesta', text: 'Diseño, prueba de prenda y precio por volumen en 3 días hábiles.' },
            { n: '03', title: 'Medición', text: 'Medimos a cada colaborador en tus oficinas de la zona metropolitana, o con nuestra guía por videollamada.' },
            { n: '04', title: 'Entrega', text: 'Prendas etiquetadas por colaborador, con ajuste incluido y reposiciones con la misma tela durante el año.' },
        ];

        const BENEFITS = [
            'Ejecutivo de cuenta y precio fijo por un año',
            'Colores institucionales y cortes propios',
            'Bordado de logotipo sin costo de digitalización',
            'Medición en sitio en CDMX y área metropolitana',
            'Reposición de piezas con la misma tela y color',
            'Factura CFDI y crédito a empresas aprobadas',
        ];

        const EMPTY = { company: '', contact: '', role: '', email: '', phone: '', staff: '', lines: [], needed_by: '', notes: '', consent: false };

        const CompaniesPage = () => {
            const catalog = useCatalog();
            const [form, setForm] = useState(EMPTY);
            const [sent, setSent] = useState(null);
            const f = (key) => ({ value: form[key], onChange: (e) => setForm({ ...form, [key]: e.target.value }) });
            const toggleLine = (id) => setForm({ ...form, lines: form.lines.includes(id) ? form.lines.filter(x => x !== id) : [...form.lines, id] });

            const submit = async (e) => {
                e.preventDefault();
                const saved = await db.submitCompanyRequest(form);
                const text = [
                    `Hola Zarem, solicito el programa para empresas (${saved.id}).`,
                    `Empresa: ${form.company} · ${form.staff} colaboradores`,
                    `Contacto: ${form.contact}${form.role ? ` (${form.role})` : ''} · ${form.email} · ${form.phone}`,
                    form.lines.length > 0 && `Líneas: ${form.lines.map(id => catalog.line[id]?.label || id).join(', ')}`,
                    form.needed_by && `Para: ${form.needed_by}`,
                    form.notes && `Notas: ${form.notes}`,
                ].filter(Boolean).join('\n');
                window.open(waLink(text), '_blank', 'noopener,noreferrer');
                setSent(saved);
            };

            return (
                <>
                    <section className="twill text-white">
                        <div className="max-w-7xl mx-auto px-4 md:px-8 py-20 md:py-28 grid lg:grid-cols-2 gap-12 items-center">
                            <div className="animate-rise-in">
                                <p className="kicker text-acero-300 mb-5">Programa para empresas</p>
                                <h1 className="text-5xl md:text-7xl leading-[1.02]">Una imagen. <span className="italic text-acero-300">Todo tu equipo.</span></h1>
                                <p className="text-white/75 text-lg mt-6 max-w-lg leading-relaxed">Diseñamos, medimos y confeccionamos los uniformes de tu empresa en nuestro taller de la Ciudad de México. Desde {catalog.rules ? catalog.rules.company_from_qty : 100} piezas.</p>
                                <a href="#solicitud" className="btn bg-white text-noche hover:bg-hielo-100 mt-9">Solicitar propuesta <IconArrow className="w-4 h-4" /></a>
                            </div>
                            <ul className="grid sm:grid-cols-2 gap-3">
                                {BENEFITS.map(b => <li key={b} className="reveal rounded-2xl bg-white/[.05] border border-white/10 p-5 text-sm flex gap-3"><IconCheck className="w-5 h-5 text-acero-300 shrink-0" />{b}</li>)}
                            </ul>
                        </div>
                    </section>

                    <section className="max-w-7xl mx-auto px-4 md:px-8 py-20">
                        <SectionTitle kicker="Cómo trabajamos" accent="en cuatro pasos">Del diagnóstico a la entrega</SectionTitle>
                        <ol className="grid sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            {STEPS.map(s => (
                                <li key={s.n} className="reveal">
                                    <hr className="stitch mb-5" />
                                    <p className="font-display text-4xl text-acero-300">{s.n}</p>
                                    <h3 className="text-2xl mt-2">{s.title}</h3>
                                    <p className="text-acero-600 mt-2 text-sm leading-relaxed">{s.text}</p>
                                </li>
                            ))}
                        </ol>
                    </section>

                    <section className="bg-hielo-50 py-16">
                        <div className="max-w-7xl mx-auto px-4 md:px-8">
                            <p className="kicker text-acero text-center mb-6">Vestimos equipos de</p>
                            <ul className="flex flex-wrap justify-center gap-3">
                                {catalog.lines.flatMap(l => l.sectors).map(s => <li key={s} className="px-5 py-2.5 rounded-full bg-white border border-noche-line text-sm">{s}</li>)}
                            </ul>
                        </div>
                    </section>

                    <section id="solicitud" className="max-w-5xl mx-auto px-4 md:px-8 py-20 scroll-mt-24">
                        {sent ? (
                            <div className="text-center animate-rise-in">
                                <p className="kicker text-acero">Solicitud {sent.id}</p>
                                <h2 className="text-4xl md:text-5xl mt-3">Gracias. Te contactamos en <span className="accent">un día hábil.</span></h2>
                                <p className="text-acero-600 mt-4">Si WhatsApp no se abrió, escríbenos a {BRAND.sales} con la referencia {sent.id}.</p>
                                <a href="/pages/tienda/" className="btn btn-dark mt-8">Ver la tienda</a>
                            </div>
                        ) : (
                            <>
                                <SectionTitle kicker="Solicitud" accent="a tu medida" center>Una propuesta</SectionTitle>
                                <form onSubmit={submit} className="grid sm:grid-cols-2 gap-3 rounded-3xl border border-noche-line p-6 md:p-10">
                                    <input className="field" placeholder="Empresa" required autoComplete="organization" {...f('company')} />
                                    <input className="field" type="number" min="1" placeholder="Nº de colaboradores a uniformar" required {...f('staff')} />
                                    <input className="field" placeholder="Nombre de contacto" required autoComplete="name" {...f('contact')} />
                                    <input className="field" placeholder="Puesto (opcional)" autoComplete="organization-title" {...f('role')} />
                                    <input className="field" type="email" placeholder="Email" required autoComplete="email" {...f('email')} />
                                    <input className="field" type="tel" placeholder="Teléfono" required autoComplete="tel" {...f('phone')} />
                                    <fieldset className="sm:col-span-2 pt-2">
                                        <legend className="text-sm mb-2">Líneas de interés</legend>
                                        <div className="flex flex-wrap gap-2">
                                            {catalog.lines.map(l => (
                                                <button type="button" key={l.id} aria-pressed={form.lines.includes(l.id)} onClick={() => toggleLine(l.id)}
                                                    className={`px-4 py-2 rounded-full text-sm border ${form.lines.includes(l.id) ? 'bg-noche text-white border-noche' : 'border-noche-line hover:border-noche'}`}>{l.label}</button>
                                            ))}
                                        </div>
                                    </fieldset>
                                    <label className="text-sm sm:col-span-2">¿Para cuándo los necesitas? (opcional)
                                        <input className="field mt-1" type="date" {...f('needed_by')} /></label>
                                    <textarea className="field sm:col-span-2" rows="4" maxLength={800} placeholder="Cuéntanos: prendas, colores institucionales, uso diario, sucursales…" {...f('notes')} />
                                    <label className="flex gap-3 text-sm text-acero-600 sm:col-span-2">
                                        <input type="checkbox" required checked={form.consent} onChange={e => setForm({ ...form, consent: e.target.checked })} className="mt-1 accent-[#1e3a6e]" />
                                        <span>Acepto el <a href="/pages/privacidad/" className="underline">aviso de privacidad</a>.</span>
                                    </label>
                                    <button className="btn btn-blue sm:col-span-2 mt-2"><IconWhatsApp className="w-5 h-5" /> Enviar solicitud</button>
                                </form>
                            </>
                        )}
                    </section>
                </>
            );
        };

        renderPage(CompaniesPage);
    </script>
</body>
</html>
